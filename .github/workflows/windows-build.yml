name: Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows x64 EXE
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Set up stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Cache Rust build files
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-x64-rust-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Check frontend
        run: npm run lint

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Test collector and persistence
        working-directory: src-tauri
        run: cargo test --locked --no-default-features

      - name: Build NSIS installer
        run: npm run tauri -- build --ci --bundles nsis -- --locked

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NetSight-Windows-x64-${{ github.run_number }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
